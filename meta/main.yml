---
# Note that dependencies listed here are automatically installed
# before this role.  Role variables for any roles listed here can be
# assigned static variables.
#
# See also cisagov/skeleton-ansible-role#153.
dependencies:
  - name: docker
    src: https://github.com/cisagov/ansible-role-docker
  - name: httpd
    src: https://github.com/cisagov/ansible-role-httpd
galaxy_info:
  author: Kyle Evers
  company: CISA Cyber Assessments
  description: Install Guacamole
  galaxy_tags:
    - guacamole
  license: CC0-1.0
  # With the release of version 2.10, Ansible finally correctly
  # identifies Kali Linux as being the Kali distribution of the Debian
  # OS family.  This simplifies a lot of things for roles that support
  # Kali Linux, so it makes sense to force the installation of Ansible
  # 2.10 or newer.
  min_ansible_version: "2.10"
  namespace: cisagov
  platforms:
    # RedHat support was removed from this Ansible role because some
    # of its tasks are Debian-specific.
    # - name: Amazon Linux
    #   versions:
    #     - "2023"
    - name: Debian
      versions:
        - buster
        - bullseye
        - bookworm
        - trixie
        # Docker does not yet officially support Debian Forky.  See
        # https://docs.docker.com/engine/install/debian/ for more
        # details.
        # - forky
    # RedHat support was removed from this Ansible role because some
    # of its tasks are Debian-specific.
    # - name: Fedora
    #   versions:
    #     - "42"
    #     - "43"
    - name: Kali
      versions:
        - "2023"
    - name: Ubuntu
      versions:
        - jammy
        - noble
  role_name: guacamole
  standalone: true
